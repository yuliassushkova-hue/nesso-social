name: publish

# GitHub starts scheduled runs late and drops most of them: on 1 and 2 November the ten-minute
# schedule below fired about once every four hours. So a run does not publish once and stop: it
# stays on watch for almost six hours (the limit for a job), checking every three minutes, and
# the next scheduled run waits in the queue behind it. One trigger in six hours is enough to keep
# posts on time. Actions minutes are free on a public repository; a private one could not afford
# this (2000 minutes a month).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to stay on watch (minutes)
        default: '340'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a rebase needs the history; a shallow clone cannot rebase at all
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish what is due, every three minutes for 5 h 40 min
        env:
          IG_IT_TOKEN: ${{ secrets.IG_IT_TOKEN }}
          IG_DK_TOKEN: ${{ secrets.IG_DK_TOKEN }}
          IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
          IG_IT_ACCOUNT_ID: ${{ secrets.IG_IT_ACCOUNT_ID }}
          IG_DK_ACCOUNT_ID: ${{ secrets.IG_DK_ACCOUNT_ID }}
          IG_EN_ACCOUNT_ID: ${{ secrets.IG_EN_ACCOUNT_ID }}
          THREADS_IT_TOKEN: ${{ secrets.THREADS_IT_TOKEN }}
          THREADS_DK_TOKEN: ${{ secrets.THREADS_DK_TOKEN }}
          LI_JULIA_TOKEN: ${{ secrets.LI_JULIA_TOKEN }}
          LI_NIKITA_TOKEN: ${{ secrets.LI_NIKITA_TOKEN }}
          LI_NESSO_TOKEN: ${{ secrets.LI_NESSO_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          WATCH_MINUTES: ${{ inputs.minutes || '340' }}
        run: |
          git config user.name "nesso-social"
          git config user.email "nesso-social@users.noreply.github.com"
          end=$(( $(date +%s) + WATCH_MINUTES * 60 ))
          while :; do
            # A post merged while this run is on watch is picked up here, and its files are
            # served from the commit that holds them, not from the one this run started on.
            git pull --rebase --quiet origin main || { git rebase --abort 2>/dev/null; echo "pull failed, using what is here"; }
            export MEDIA_SHA=$(git rev-parse HEAD)
            echo "check at $(TZ=Europe/Rome date +%H:%M) Rome, files from ${MEDIA_SHA:0:7}"
            node bin/social.mjs publish || echo "a post failed; it is tried again next round"
            git add published.json
            if ! git diff --cached --quiet; then
              git commit --quiet -m "chore: record published posts"
              git push --quiet || { git pull --rebase --quiet origin main && git push --quiet; } || { git rebase --abort 2>/dev/null; echo "push failed; recorded next round"; }
            fi
            [ $(date +%s) -ge $end ] && break
            sleep 180
          done
          # A record that never reached GitHub would let the next run publish the same post again.
          for i in 1 2 3; do
            git push --quiet && break
            sleep 20; git pull --rebase --quiet origin main || git rebase --abort 2>/dev/null
          done
