name: publish

# Hourly, at seven past: a private repository has 2000 free Actions minutes a month,
# and every 15 minutes would spend about 2900 of them.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish what is due
        run: node bin/social.mjs publish
        env:
          IG_IT_TOKEN: ${{ secrets.IG_IT_TOKEN }}
          IG_DK_TOKEN: ${{ secrets.IG_DK_TOKEN }}
          IG_IT_ACCOUNT_ID: ${{ secrets.IG_IT_ACCOUNT_ID }}
          IG_DK_ACCOUNT_ID: ${{ secrets.IG_DK_ACCOUNT_ID }}
          THREADS_IT_TOKEN: ${{ secrets.THREADS_IT_TOKEN }}
          THREADS_DK_TOKEN: ${{ secrets.THREADS_DK_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
      # Runs even when one post failed, so the ones that went out are recorded
      # and are not published again next hour.
      - name: Record what went out
        if: always()
        run: |
          git config user.name "nesso-social"
          git config user.email "nesso-social@users.noreply.github.com"
          git add published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record published posts"
            git push || (git pull --rebase && git push)
          fi
