name: rehearse

# On every pull request that adds posts: Instagram and Threads fetch and process each file exactly
# as they will on the day, and nothing is published. A red check means a post would fail.
on:
  pull_request:
    paths: ['posts/**']
  workflow_dispatch:
    inputs:
      posts:
        description: "Comma-separated post folders to rehearse"
        required: false
        default: ""

concurrency:
  group: rehearse  # never two at once: Instagram counts every container
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which posts this change adds or edits
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.posts }}" ]; then
            echo "list=${{ github.event.inputs.posts }}" >> "$GITHUB_OUTPUT"
          else
            list=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" -- posts | cut -d/ -f2 | sort -u | paste -sd, -)
            echo "list=$list" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/social.mjs rehearse
        env:
          MEDIA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REHEARSE_ONLY: ${{ steps.changed.outputs.list }}
          IG_IT_TOKEN: ${{ secrets.IG_IT_TOKEN }}
          IG_DK_TOKEN: ${{ secrets.IG_DK_TOKEN }}
          IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
          IG_IT_ACCOUNT_ID: ${{ secrets.IG_IT_ACCOUNT_ID }}
          IG_DK_ACCOUNT_ID: ${{ secrets.IG_DK_ACCOUNT_ID }}
          IG_EN_ACCOUNT_ID: ${{ secrets.IG_EN_ACCOUNT_ID }}
          THREADS_IT_TOKEN: ${{ secrets.THREADS_IT_TOKEN }}
          THREADS_DK_TOKEN: ${{ secrets.THREADS_DK_TOKEN }}
          LI_JULIA_TOKEN: ${{ secrets.LI_JULIA_TOKEN }}
          LI_NESSO_TOKEN: ${{ secrets.LI_NESSO_TOKEN }}
